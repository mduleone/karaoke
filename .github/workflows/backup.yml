name: Nightly Backup

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/backup.ts

      - name: Commit to backups branch
        run: |
          cp songs_backup.json /tmp/songs_backup.json
          cp singing_records_backup.json /tmp/singing_records_backup.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout backups
          cp /tmp/songs_backup.json songs_backup.json
          cp /tmp/singing_records_backup.json singing_records_backup.json
          git add songs_backup.json singing_records_backup.json
          if ! git diff --staged --quiet; then
            git commit -m "Backup $(date -u '+%Y-%m-%d')"
            git push origin backups
          fi
